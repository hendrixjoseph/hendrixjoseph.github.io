message: >-
  It's been almost five years since I published this post, so I was curious how
  my numbers have changed:

  * Waist - 37 inches
  
  * Hip - 36.5 inches
  
  * Chest - 40.5 inches
  
  * Neck - 15.5 inches
  
  * Right bicep - 13 inches
  
  * Right thigh - 22 inches
  
  * Calf - 16 inches

  The only significant difference is my waist and hip - I've lost about two
  inches there.


  It's interesting that I've lost inches for my neck, bicep, thigh, and calf.
  The difference in those numbers, plus the gain in chest, might be explained by
  merely measuring at a slightly different spot.


  We'll see what happens in the next five years.
